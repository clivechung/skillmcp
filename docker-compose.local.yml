services:
  nginx:
    image: nginx:alpine
    container_name: skillmcp-local-ingress
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - skillmcp-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  skillmcp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillmcp-local-app
    ports:
      - "8000:8000"
    volumes:
      - ./skills:/app/skills:ro
      - ./src:/app/src:ro
    environment:
      - SKILLMCP_LOG_LEVEL=DEBUG
      - SKILLMCP_HOST=0.0.0.0
      - SKILLMCP_PORT=8000
      - SKILLMCP_SKILLS_DIR=/app/skills


