[project]
name = "skillmcp"
version = "0.1.0"
description = "Containerized, horizontally scalable Skill Management System over Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
skillmcp = "skillmcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillmcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
addopts = "-o cache_dir=/tmp/pytest_cache --timeout=15"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
