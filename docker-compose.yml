services:
  nginx:
    image: nginx:alpine
    container_name: skill-mcp-ingress
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - skill-mcp-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  skill-mcp-app:
    image: ${SKILL_MCP_IMAGE:-docker.io/clivechung/skill-mcp:latest}
    restart: unless-stopped
    environment:
      - SKILL_MCP_LOG_LEVEL=INFO
      - SKILL_MCP_HOST=0.0.0.0
      - SKILL_MCP_PORT=8000
    deploy:
      replicas: 2

