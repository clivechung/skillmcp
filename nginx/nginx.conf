user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Upstream backend pool for horizontal load balancing across stateless replicas
    upstream skillmcp_backend {
        least_conn;
        server skillmcp-app:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Nginx ingress health check endpoint
        location /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","ingress":"nginx"}';
        }

        # Route all MCP and API traffic to upstream backend pool
        location / {
            proxy_pass http://skillmcp_backend;

            # HTTP 1.1 keepalive for streamable HTTP transport
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering & cache for real-time streaming chunks
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # High timeouts for long-running streaming interactions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
